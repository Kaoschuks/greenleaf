services:
  api:
    container_name: api
    build: .
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - ./src:/usr/src/app/src
    restart: unless-stopped

  db:
    container_name: db
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: greenleaf
      MYSQL_USER: greenleafuser
      MYSQL_PASSWORD: greenleafpassword
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./src/dbscript.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  dbdata:
